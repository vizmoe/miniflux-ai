services:
  miniflux-ai:
    image: ${MINIFLUX_AI_IMAGE:-miniflux-ai:local}
    build:
      context: .
    init: true
    restart: unless-stopped
    stop_grace_period: 40s
    ports:
      - '${MINIFLUX_AI_BIND:-127.0.0.1}:${MINIFLUX_AI_PORT:-8080}:8080'
    volumes:
      - ./config:/app/config
      - miniflux_ai_data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
volumes:
  miniflux_ai_data:
